name: Test Dockerfile
on: pull_request

jobs:
  dockerfile-test:
    name: container-structure-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Build
        run: docker build -t api-test .
      - name: Check it exists
        run: docker images

      - name: Run docker tests
        uses: docker://ghcr.io/googlecontainertools/container-structure-test@sha256:710da3ca8ed29a42423315592f74f02df4e3d2ba19f1df7257bd481ea75ba5aa # latest v1.22.1
        with:
          args: "test --image api-test --config docker-test.yaml"
